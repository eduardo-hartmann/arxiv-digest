name: daily-digest

on:
  schedule:
    # 05:30 UTC Mon-Fri, after arXiv's ~00:00 UTC announcement.
    # (GitHub may start scheduled runs some minutes late.)
    - cron: "17 5 * * 1-5"
    - cron: "47 6 * * 1-5"
    - cron: "23 8 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's digest even if it exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["digests/**", "site/**", "config.yaml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build today's digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m digest.run ${{ inputs.force && '--force' || '' }}

      - name: Commit results
        run: |
          git config user.name "arxiv-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests data feedback interests_learned.md
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Digest $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Close processed feedback issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m digest.feedback close

  deploy:
    needs: digest
    if: always() && needs.digest.result != 'failure' && needs.digest.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install markdown pymdown-extensions PyYAML

      - run: python site/build.py

      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "arxiv-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - id: deployment
        uses: actions/deploy-pages@v4
